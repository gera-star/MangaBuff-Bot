name: Buffy Server Daemon

on:
  schedule:
    # Start roughly every hour, off the top of the hour; the bot runs for 55 minutes.
    - cron: "7 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: buffy-server-daemon
  cancel-in-progress: false

jobs:
  daemon:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    env:
      BUFFY_HOME: ${{ github.workspace }}/.buffy-home
      MANGA_LOGIN: ${{ secrets.MANGA_LOGIN }}
      MANGA_PASSWORD: ${{ secrets.MANGA_PASSWORD }}
      MANGABUFF_PROXY: ${{ secrets.MANGABUFF_PROXY }}
      BUFFY_STATE_KEY: ${{ secrets.BUFFY_STATE_KEY }}
      BOT_RUN_DURATION: ${{ github.event_name == 'workflow_dispatch' && '5m' || '55m' }}

    steps:
      - name: Check out Buffy source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify required repository secrets
        shell: bash
        run: |
          test -n "$MANGA_LOGIN" || { echo "::error::Add repository secret MANGA_LOGIN"; exit 1; }
          test -n "$MANGA_PASSWORD" || { echo "::error::Add repository secret MANGA_PASSWORD"; exit 1; }
          test -n "$BUFFY_STATE_KEY" || { echo "::error::Add repository secret BUFFY_STATE_KEY"; exit 1; }

      - name: Install bot dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Check MangaBuff access before starting the bot
        shell: bash
        run: |
          python - <<'PY'
          import os
          import sys
          from bs4 import BeautifulSoup
          from http_session import create_raw_session, is_anti_bot_page, try_refresh_ddos_guard
          from utils import normalize_proxy_url

          raw_proxy = os.getenv("MANGABUFF_PROXY", "")
          proxy = normalize_proxy_url(raw_proxy)
          session = create_raw_session(proxy=proxy, impersonate="chrome131")

          try:
              response = session.get("https://mangabuff.ru/login", timeout=20)
              reason = is_anti_bot_page(response)
              if reason == "ddos_guard_geo":
                  if proxy:
                      print("::error::MangaBuff blocks the configured proxy by IP/region. Check that MANGABUFF_PROXY is valid and uses a network permitted by MangaBuff.")
                  else:
                      print("::error::MangaBuff blocks the GitHub runner IP by region. Add the repository secret MANGABUFF_PROXY for a proxy/network that is permitted by MangaBuff, or use a runner on an allowed network.")
                  sys.exit(1)

              if reason:
                  try_refresh_ddos_guard(session)
                  response = session.get("https://mangabuff.ru/login", timeout=20)
                  reason = is_anti_bot_page(response)

              if reason == "ddos_guard_geo":
                  print("::error::MangaBuff still geoblocks the runner after the protection check. Use a permitted network or proxy; code changes cannot create a valid CSRF token from a blocked response.")
                  sys.exit(1)
              if reason:
                  print(f"::error::MangaBuff returned an anti-bot page ({reason}). Verify the configured proxy/network and retry later.")
                  sys.exit(1)

              token = BeautifulSoup(response.text or "", "html.parser").find("meta", attrs={"name": "csrf-token"})
              if not token or not token.get("content"):
                  print("::error::MangaBuff response did not contain the expected CSRF token. It is not a normal login page; inspect the response/site status before starting the bot.")
                  sys.exit(1)

              print("MangaBuff login page is reachable and includes the expected CSRF token.")
              print("Proxy configured:", "yes" if proxy else "no")
          except Exception as exc:
              print(f"::error::MangaBuff preflight request failed ({type(exc).__name__}). Check network access and MANGABUFF_PROXY without exposing proxy credentials.")
              sys.exit(1)
          finally:
              try:
                  session.close()
              except Exception:
                  pass
          PY

      - name: Restore encrypted bot state
        id: restore_state
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/buffy-state-cache
          key: buffy-encrypted-state-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            buffy-encrypted-state-v1-

      - name: Decrypt saved state
        id: load_state
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$BUFFY_HOME" "$RUNNER_TEMP/buffy-state-cache"
          if [ -f "$RUNNER_TEMP/buffy-state-cache/state.enc" ]; then
            openssl enc -d -aes-256-cbc -pbkdf2 \
              -in "$RUNNER_TEMP/buffy-state-cache/state.enc" \
              -out "$RUNNER_TEMP/buffy-state.tar.gz" \
              -pass env:BUFFY_STATE_KEY
            tar -xzf "$RUNNER_TEMP/buffy-state.tar.gz" -C "$BUFFY_HOME"
            rm -f "$RUNNER_TEMP/buffy-state.tar.gz"
            echo "Restored encrypted state."
          else
            echo "No prior state found; first run will log in using repository secrets."
          fi

      - name: Apply repository login
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import tempfile

          os.makedirs(os.environ["BUFFY_HOME"], exist_ok=True)
          path = os.path.join(os.environ["BUFFY_HOME"], "user_data.json")
          try:
              with open(path, "r", encoding="utf-8") as source:
                  data = json.load(source)
          except (OSError, json.JSONDecodeError):
              data = {}
          data["email"] = os.environ["MANGA_LOGIN"]
          data["password"] = os.environ["MANGA_PASSWORD"]
          fd, temporary = tempfile.mkstemp(dir=os.environ["BUFFY_HOME"], prefix=".user_data-")
          try:
              with os.fdopen(fd, "w", encoding="utf-8") as target:
                  json.dump(data, target, ensure_ascii=False, indent=2)
              os.replace(temporary, path)
          finally:
              if os.path.exists(temporary):
                  os.unlink(temporary)
          PY

      - name: Run Buffy daemon
        id: run_bot
        shell: bash
        run: |
          set +e
          timeout --signal=TERM --kill-after=30s "$BOT_RUN_DURATION" python -u main.py --daemon
          status=$?
          set -e
          if [ "$status" -eq 124 ] || [ "$status" -eq 137 ] || [ "$status" -eq 143 ]; then
            echo "Run window ended as planned."
            exit 0
          fi
          exit "$status"

      - name: Encrypt latest state
        id: encrypt_state
        if: always() && steps.load_state.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/buffy-state-cache"
          tar -czf "$RUNNER_TEMP/buffy-state.tar.gz" -C "$BUFFY_HOME" .
          openssl enc -aes-256-cbc -salt -pbkdf2 \
            -in "$RUNNER_TEMP/buffy-state.tar.gz" \
            -out "$RUNNER_TEMP/buffy-state-cache/state.enc" \
            -pass env:BUFFY_STATE_KEY
          rm -f "$RUNNER_TEMP/buffy-state.tar.gz"
          echo "Bot state encrypted for the next run."

      - name: Save encrypted state for the next run
        if: always() && steps.encrypt_state.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/buffy-state-cache
          key: buffy-encrypted-state-v1-${{ github.run_id }}-${{ github.run_attempt }}
